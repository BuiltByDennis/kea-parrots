# Kea Parrot — CI workflow (DRAFT, Product P0)

# What this workflow does: implements the merged 15-step CI gates (D-07,
# README.md / KEA-RDY-006) as GitHub Actions jobs. Every job is a gate;
# a failed critical gate blocks the release. Jobs run on pull requests
# and on pushes to main. No job silently ignores a failure.
#
# TODO before first run (P0, owner + versions agent):
# - Fill in VERSIONS.md (OD-22) and .nvmrc; this workflow reads the Node
#   version from .nvmrc (node-version-file) — it will fail until .nvmrc
#   holds a real version.
# - Confirm the package manager (assumed npm + package-lock.json — see
#   VERSIONS.md slot 2). If another manager is pinned, change `npm ci`
#   and the cache setting below together.
# - Add the repository secrets the DB/RLS + smoke jobs need (see the
#   `db-rls` and `smoke` jobs): SUPABASE_TEST_URL, SUPABASE_TEST_ANON_KEY,
#   SUPABASE_TEST_SERVICE_ROLE_KEY — from the automated-testing Supabase
#   project (D-08). Never put a real key in this file.
# - Configure the `production` GitHub Environment with required reviewers
#   (the approval gate, step 15) — that is a repo setting, not code.
# - Test-framework jobs (unit/component/integration/api/db-rls/e2e) call
#   the package.json scripts; they cannot pass until the runner is pinned
#   (VERSIONS.md slots 13–15) and at least the P0 smoke test exists.
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate 1 — dependency install (also the checkout every later job needs).
  # Runs first; every other job needs it. A failed install fails the run.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies (exact, from lockfile)
        working-directory: apps/web
        run: npm ci
      - name: Verify lockfile matches package.json
        working-directory: apps/web
        run: npm ls --depth=0 || true
        # NOTE: `npm ls` is a sanity check only; `npm ci` already fails on
        # a lockfile/package.json mismatch. Do not let this step mask that.

  # Gate 2 — formatting.
  format:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run format
        working-directory: apps/web

  # Gate 3 — linting.
  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web

  # Gate 4 — type checking.
  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web

  # Gate 5 — unit tests.
  unit:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run test:unit
        working-directory: apps/web

  # Gate 6 — component tests.
  component:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run test:component
        working-directory: apps/web

  # Gate 7 — integration tests.
  integration:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run test:integration
        working-directory: apps/web

  # Gate 8 — API tests (direct API calls, not only browser — KEA-TPR-005 §5.16–5.18).
  api:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run test:api
        working-directory: apps/web

  # Gate 9 — database & RLS tests.
  # Runs against the automated-testing Supabase project (D-08, ephemeral).
  # Requires repo secrets (see header TODO). RLS is tested independently of
  # the frontend, with separate identities (KEA-TPR-005 §5.10–5.14).
  # TODO (P0): wire the ephemeral test project + secrets before this job
  # can pass. Do NOT point this job at staging or production.
  db-rls:
    needs: install
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run test:db
        working-directory: apps/web

  # Gate 10 — production build.
  build:
    needs: [format, lint, typecheck, unit, component, integration, api, db-rls]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          # Build-time placeholders only — the build must succeed without
          # real secrets. Real values come from the deployment environment.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # Gate 11 — security & dependency scans.
  # Baseline in P0: `npm audit` (fails on high/critical). A dedicated
  # scanner (Dependabot / Snyk / etc.) is a P1 hardening item — record the
  # choice in docs/SECURITY.md when it is made; do not silently add one.
  security:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Dependency audit (fail on high/critical)
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Check for committed secrets (baseline scan)
        run: |
          # Fails the job if an obvious secret pattern is committed.
          # This is a baseline tripwire, not a replacement for a real
          # secret scanner (P1 hardening).
          ! grep -RInE --exclude-dir=node_modules --exclude-dir=.git \
            '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY=[^Y]|sk_live_|ghp_)' \
            . || (echo 'Possible committed secret — see output above' && exit 1)

  # Gate 12 — migration validation.
  # Validates that every migration in infrastructure/migrations/ applies
  # cleanly to a fresh database and that no destructive change is present
  # without an approved migration review (KEA-DBS-002 §9).
  # TODO (P0): this job is a placeholder until migration 001 exists
  # (blocked on OD-1/OD-3/OD-4). It passes vacuously on an empty
  # migrations directory and must be wired to the Supabase CLI (VERSIONS.md
  # slot 16) when migration 001 lands. Do not delete it in the meantime.
  migration-validation:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List migrations (must be empty or valid until OD-1/3/4 close)
        run: |
          ls -la infrastructure/migrations/ || echo 'no migrations directory yet'
          echo 'TODO: wire Supabase CLI migration validation when migration 001 lands (OD-1/OD-3/OD-4).'

  # Gate 13 — deployment checks.
  # Verifies the deployment target is reachable and configured before any
  # deploy proceeds. In P0 this is a config-presence check only; the
  # staging deploy itself is a P1 activity (KEA-RDY-006 R1+).
  deployment-checks:
    needs: [build, security, migration-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required deployment configuration exists
        run: |
          test -f apps/web/package.json
          test -f .github/workflows/ci.yml
          echo 'TODO (P0): add Vercel project linkage check once the staging project exists (P0_CHECKLIST.md).'

  # Gate 14 — post-deployment smoke tests.
  # Runs after a deployment to staging (P1 onward). In P0 there is no
  # deployment yet, so this job is defined but skipped until the staging
  # project exists — it must NOT be deleted. It runs the E2E smoke suite
  # against the deployed URL (KEA-TPR-005 §5.61 / KEA-RDY-006 §12.6).
  # TODO (P0): wire PLAYWRIGHT_BASE_URL / staging URL when staging exists.
  smoke:
    needs: [deployment-checks]
    if: false # P0: no deployment exists yet — enable when staging is live (P0_CHECKLIST.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_URL }}

  # Gate 15 — required approval gate.
  # This job runs in the `production` GitHub Environment, which the owner
  # configures with required reviewers. It runs only after every other
  # gate passes, and a human approval is required before any production
  # deployment proceeds (KEA-RDY-006 §12.4 step 6). There is no code that
  # can substitute for this: if the environment is not configured, the
  # job waits forever — that is the gate working as designed.
  approval:
    needs: [deployment-checks]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approval gate
        run: echo 'All CI gates passed. Production deployment approved by a required reviewer.'
